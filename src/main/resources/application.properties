spring.application.name=embeddr
spring.main.banner-mode=off
server.port=${PORT:8080}

# The frontend build. web/dist first, so `./gradlew web` refreshes the UI of
# a running app; the copy inside the jar serves deployments.
spring.web.resources.static-locations=file:./web/dist/,classpath:/static/

# Unleash connection. bootRun loads these variables from .env; a deployment
# sets them in its environment. See .env.example for what each one is.
unleash.url=${UNLEASH_URL:}
unleash.backend-token=${UNLEASH_BACKEND_TOKEN:}
unleash.metrics-interval-seconds=${UNLEASH_METRICS_INTERVAL_SECONDS:5}

# The SDK's own logging is noisy at info; the flags wrapper logs what matters.
logging.level.io.getunleash=warn
logging.level.io.getunleash.embeddr=info

# Browsers send cookies from other localhost apps along; Tomcat warns about
# the ones it cannot parse. Harmless, so keep it out of the workshop log.
logging.level.org.apache.tomcat.util.http.parser.Cookie=error
